<style>
  /* Campfire, as on the install page and the sites themselves (the fonts are the device's own here). */
  :root { --bg: #16201b; --surface: #1f2b25; --raised: #263329; --sunken: #121a16; --text: #ede6da; --muted: #a9a092; --border: #2e3d35;
          --accent: #ff8a3d; --accent-strong: #ffab73; --accent-soft: #2b2118; --on-accent: #16201b; --moss: #8fbf7f; color-scheme: dark;
          --round: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

  .brand .o { width: 0.82em; height: 0.82em; margin: 0.08em 0.01em 0; color: var(--accent); }
  .lede { color: var(--muted); margin: 0 0 24px; font-size: 1.08rem; }
  nav.contents { background: var(--surface); border-radius: 22px; padding: 16px 20px; margin: 0 0 28px; }
  nav.contents ol { margin: 6px 0 0; padding-left: 1.3rem; }
  @media (min-width: 560px) { nav.contents ol { columns: 2; gap: 24px; } }
  nav.contents li { margin: 3px 0; break-inside: avoid; }
  section { margin: 34px 0 0; }
  h2 { font: 900 1.45rem/1.2 var(--round); margin: 0 0 10px; letter-spacing: -0.01em; }
  h3 { font: 800 1.05rem/1.3 var(--round); margin: 20px 0 6px; }
  p, li { margin: 8px 0; }
  ul { padding-left: 1.2rem; }
  a { color: var(--accent-strong); }
  code { font: 0.88em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--sunken); padding: 0.1em 0.4em; border-radius: 6px; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .boxes { display: grid; gap: 12px; margin: 14px 0; }
  @media (min-width: 560px) { .boxes { grid-template-columns: 1fr 1fr; } }
  .box { background: var(--surface); border-radius: 18px; padding: 14px 16px; }
  .box strong { display: block; font: 800 1rem var(--round); margin-bottom: 4px; }
  .box p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .flow { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
  .flow li { background: var(--surface); border-radius: 14px; padding: 10px 14px 10px 44px; position: relative; }
  .flow li::before { content: counter(flow); counter-increment: flow; position: absolute; left: 12px; top: 10px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent); font: 800 0.8rem/22px var(--round); text-align: center; }
  .flow { counter-reset: flow; }
  .never { background: var(--accent-soft); border-radius: 22px; padding: 18px 20px; margin: 18px 0; }
  .never h3 { margin-top: 0; color: var(--accent-strong); }
  .never ul { margin: 0; }
  .yes { color: var(--moss); font-weight: 800; }
  .no { color: var(--accent-strong); font-weight: 800; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.95rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
  footer { margin-top: 36px; color: var(--muted); font-size: 0.85rem; }
  .back { display: inline-block; margin-top: 28px; padding: 11px 20px; border-radius: 999px; background: var(--raised); color: var(--text);
    font: 800 1rem var(--round); text-decoration: none; }
