# The self-hosted image (worker/selfhost/), built from each release's tag and published to GitHub's container
# registry as ghcr.io/afterwrd/afterwrd:<version> and :latest, for x86 and ARM servers (a Raspberry Pi, say).
# Each kind is built on its own kind of runner, with the Docker already there, then the two are put together under one
# name, with a signed record of the build (as releases have: release.yml). To check an image:
#   gh attestation verify oci://ghcr.io/afterwrd/afterwrd:<version> --repo afterwrd/afterwrd
name: Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write # publish the image
  id-token: write # sign the build record (Sigstore issues a short-lived certificate for this workflow run)
  attestations: write # store the build record with the repository
  artifact-metadata: write # note where the image is kept, beside the build record

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false # one kind of server failing to build doesn't stop the other
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./worker/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):$VERSION-${{ matrix.arch }}"
          docker build -f worker/selfhost/Dockerfile -t "$image" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$VERSION" worker
          docker push "$image"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: One image for both kinds of server
        id: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$image:$version-amd64" "$image:$version-arm64"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # A signed record that this image was built here, by this workflow, from the tagged commit, kept in Sigstore's
      # public log and beside the image in the registry.
      - name: Sign the build record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
